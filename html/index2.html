<!DOCTYPE html>

<body>

  <h1>CSS Selectors Demo</h1>

  <p>This paragraph is affected by the universal selector.</p>

  <p class="highlight">This paragraph uses a class selector.</p>

  <p id="unique">This paragraph uses an ID selector.</p>

  <a href="https://www.instagram.com/graphicmercendise/" target="_blank">This is an external link (attribute selector).</a>

  <button>Hover over me (pseudo-class)</button>

  <p class="first-letter-demo">This paragraph demonstrates pseudo-element ::first-letter.</p>
